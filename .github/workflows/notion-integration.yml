name: Notion Integration Tests

on:
  workflow_dispatch:

jobs:
  notion-tests:
    runs-on: ubuntu-latest

    env:
      NOTION_ACCESS_TOKEN: ${{ secrets.NOTION_ACCESS_TOKEN }}
      NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run Notion integration tests
        run: |
          PYTHONPATH=src python -m pytest tests/integration/notion -m notion -v
